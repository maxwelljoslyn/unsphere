[project]
name = "unsphere"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "attrs>=26.1.0",
    "django>=5.2.15",
    "gunicorn>=26.0.0",
    "pint>=0.24",
    "python-dotenv>=1.2.2",
    "tzdata>=2025.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "unsphere.settings"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.15",
]
