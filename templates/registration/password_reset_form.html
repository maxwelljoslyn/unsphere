{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p>Enter the email address on your account and we'll send you a link to choose a
new password.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Send reset link</button>
</form>
<p><a href="{% url 'login' %}">Back to log in</a></p>
{% endblock %}
