{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Log in</button>
</form>
<p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
<p>No account? <a href="{% url 'register' %}">Register</a></p>
<p>Didn't get a confirmation email? <a href="{% url 'resend-confirmation' %}">Resend it</a></p>
{% endblock %}
