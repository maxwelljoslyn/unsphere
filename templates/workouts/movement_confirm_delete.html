{% extends "base.html" %}
{% block title %}Delete Movement{% endblock %}
{% block content %}
<h1>Delete movement “{{ movement.name }}”?</h1>
<p>This will also delete every exercise that uses this movement. This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Delete</button>
  <a href="{% url 'movement-list' %}">Cancel</a>
</form>
{% endblock %}
