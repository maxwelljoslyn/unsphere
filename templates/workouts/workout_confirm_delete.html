{% extends "base.html" %}
{% block title %}Delete Workout{% endblock %}
{% block content %}
<h1>Delete workout from {% include "workouts/_workout_datetime.html" %}?</h1>
<p>This will also delete all exercises recorded in this workout. This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Delete</button>
  <a href="{% url 'workout-detail' workout.pk %}">Cancel</a>
</form>
{% endblock %}
