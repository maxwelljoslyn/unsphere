<div id="add-exercise-area">
  <h3>Add Cardio Exercise</h3>
  {% if form.non_field_errors %}
    <ul>{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>
  {% endif %}
  <form hx-post="{% url 'cardio-exercise-add' workout.pk %}"
        hx-target="#add-exercise-area"
        hx-swap="outerHTML">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
</div>
