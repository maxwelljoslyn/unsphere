{% extends "base.html" %}
{% block title %}{% if workout %}Edit Workout{% else %}New Workout{% endif %}{% endblock %}
{% block content %}
<h1>{% if workout %}Edit Workout{% else %}New Workout{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a href="{% if workout %}{% url 'workout-detail' workout.pk %}{% else %}{% url 'workout-list' %}{% endif %}">Cancel</a>
</form>
<script>
  (function () {
    function pad(n) { return String(n).padStart(2, "0"); }

    // Record the zone this workout is being logged in, so it can always be shown
    // (and labeled) in that zone later. Only set it when empty, so editing keeps
    // the workout's original zone rather than overwriting it with the editor's.
    var tzEl = document.getElementById("id_timezone");
    if (tzEl && !tzEl.value) {
      try { tzEl.value = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; }
      catch (e) {}
    }

    // Default a new workout's date/time to now (local wall-clock at page load).
    // Left alone when editing, where the field is already populated.
    var dateEl = document.getElementById("id_date");
    if (dateEl && !dateEl.value) {
      var now = new Date();
      dateEl.value = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" +
        pad(now.getDate()) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
    }
  })();
</script>
{% endblock %}
