{% extends "base.html" %}
{% block title %}{% if movement %}Edit Movement{% else %}New Movement{% endif %}{% endblock %}
{% block content %}
<h1>{% if movement %}Edit Movement{% else %}New Movement{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a href="{% url 'movement-list' %}">Cancel</a>
</form>
{% endblock %}
