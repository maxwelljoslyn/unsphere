<li id="cardio-exercise-{{ ex.pk }}">{{ ex.movement }}{% if ex.distance %} — {{ ex.distance }}{% endif %}{% if ex.duration %} in {{ ex.duration }}{% endif %}{% if ex.notes %} ({{ ex.notes }}){% endif %}
  <button hx-get="{% url 'cardio-exercise-edit' ex.pk %}"
          hx-target="#cardio-exercise-{{ ex.pk }}"
          hx-swap="outerHTML">Edit</button>
  <button hx-delete="{% url 'cardio-exercise-delete' ex.pk %}"
          hx-target="#cardio-exercise-{{ ex.pk }}"
          hx-swap="outerHTML"
          hx-confirm="Delete this exercise?">Delete</button>
</li>
